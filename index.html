<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Design Flashcards</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

  <!-- Welcome / Dashboard -->
  <div id="screen-welcome" class="screen">
    <div class="welcome-header">
      <h1>System Design Flashcards</h1>
      <p class="subtitle">Mini architecture decisions. Adaptive spaced repetition. Master the trade-offs.</p>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Cards</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-reviewed">0</div><div class="stat-label">Learned</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-due">0</div><div class="stat-label">Due Now</div></div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin:12px 0" onclick="APP.startSession()">Start Session</button>
    <h2 style="margin-top:20px">Your Profile</h2>
    <div id="topic-breakdown"></div>
  </div>

  <!-- Session -->
  <div id="screen-session" class="screen hidden">
    <div class="card-header">
      <span id="card-counter">1 / 8</span>
      <div class="card-meta">
        <span id="card-topic">Topic</span>
        <span id="card-difficulty">★★★</span>
      </div>
    </div>
    <div id="scenario"></div>
    <div id="diagram-container"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="next-btn" class="btn btn-primary hidden" onclick="APP.nextCard()">Next Card →</button>
  </div>

  <!-- Session End -->
  <div id="screen-session-end" class="screen hidden">
    <h1>Session Complete</h1>
    <div id="session-summary"></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="APP.startSession()">Another Session</button>
      <button class="btn btn-outline" onclick="APP.showScreen('welcome');APP.renderDeckStats()">Dashboard</button>
    </div>
  </div>

</div>
<script src="js/cards.js"></script>
<script src="js/srs.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
